name: software-security-internal-labs

# This stack is the remote-delivery wrapper. It deliberately does not change the
# lesson sources: debug mode is disabled by the image commands, source is copied
# into immutable images, and every vulnerable process is placed on its own
# internal-only bridge. Caddy is the sole host ingress path. A fixed-purpose
# relay connects each lab bridge to Caddy's otherwise separate ingress bridge.

x-sandbox-defaults: &sandbox-defaults
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 128
  cpus: 0.50
  mem_limit: 160m
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"

x-relay-defaults: &relay-defaults
  <<: *sandbox-defaults
  build:
    context: ../..
    dockerfile: deploy/internal-labs/images/relay.Dockerfile
  expose:
    - "8080"
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
    - /data:rw,noexec,nosuid,nodev,size=8m,mode=0700,uid=10001,gid=10001
    - /config:rw,noexec,nosuid,nodev,size=4m,mode=0700,uid=10001,gid=10001
  cpus: 0.15
  mem_limit: 48m
  pids_limit: 48
  healthcheck:
    test: [CMD, caddy, validate, --config, /etc/caddy/Caddyfile]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 5s

services:
  caddy:
    <<: *sandbox-defaults
    build:
      context: ../..
      dockerfile: deploy/internal-labs/images/caddy.Dockerfile
    environment:
      BIND_ADDRESS: ${BIND_ADDRESS:-127.0.0.1}
      LEARN_HOST: ${LEARN_HOST:?set LEARN_HOST}
      WEEK01_HOST: ${WEEK01_HOST:?set WEEK01_HOST}
      WEEK04_HOST: ${WEEK04_HOST:?set WEEK04_HOST}
      WEEK05_HOST: ${WEEK05_HOST:?set WEEK05_HOST}
      WEEK06_HOST: ${WEEK06_HOST:?set WEEK06_HOST}
      TEAM_1_HOST: ${TEAM_1_HOST:?set TEAM_1_HOST}
      TEAM_2_HOST: ${TEAM_2_HOST:?set TEAM_2_HOST}
    # This is the only host-published application socket. Caddy joins only the
    # ingress bridge; it never joins a vulnerable application's network.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8443:8443"
    networks:
      - ingress_net
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    cpus: 0.50
    mem_limit: 128m
    healthcheck:
      test: [CMD, caddy, validate, --config, /etc/caddy/Caddyfile]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  learning:
    <<: *sandbox-defaults
    build:
      context: ../..
      dockerfile: deploy/internal-labs/images/learning.Dockerfile
    environment:
      SECRET_KEY: ${LIVE_QUIZ_SECRET_KEY:?set LIVE_QUIZ_SECRET_KEY}
      INVITE_CODE: ${LIVE_QUIZ_INVITE_CODE:-}
      DB_PATH: /data/live-quiz.db
      UPLOAD_DIR: /data/uploads
      COOKIE_SECURE: "1"
      SITE_ORIGIN: https://${LEARN_HOST:?set LEARN_HOST}:8443
      MASTERY_WEEK01_LAB_URL: https://${WEEK01_HOST:?set WEEK01_HOST}:8443/notes
      # Weeks 2 and 3 launch first-party, manipulable browser labs. The full
      # scanner/fuzzer and crypto toolchains remain reproducible from a local
      # checkout; the shared host never exposes a shell or Docker daemon.
      MASTERY_WEEK02_LAB_URL: https://${LEARN_HOST:?set LEARN_HOST}:8443/sim/fuzz-verdict
      MASTERY_WEEK03_LAB_URL: https://${LEARN_HOST:?set LEARN_HOST}:8443/sim/aes-modes
      MASTERY_WEEK04_LAB_URL: https://${WEEK04_HOST:?set WEEK04_HOST}:8443
      MASTERY_WEEK05_LAB_URL: https://${WEEK05_HOST:?set WEEK05_HOST}:8443
      MASTERY_WEEK06_LAB_URL: https://${WEEK06_HOST:?set WEEK06_HOST}:8443
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    volumes:
      - learning_data:/data
    networks:
      - learning_net
    cpus: 1.00
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  learning-relay:
    <<: *relay-defaults
    environment:
      UPSTREAM: learning:5000
    depends_on:
      learning:
        condition: service_healthy
    networks:
      - learning_net
      - ingress_net

  week01:
    <<: *sandbox-defaults
    build:
      context: ../..
      dockerfile: deploy/internal-labs/images/week01.Dockerfile
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    networks:
      - week01_net
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/notes', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  week01-relay:
    <<: *relay-defaults
    environment:
      UPSTREAM: week01:5000
    depends_on:
      week01:
        condition: service_healthy
    networks:
      - week01_net
      - ingress_net

  week04:
    <<: *sandbox-defaults
    build:
      context: ../..
      dockerfile: deploy/internal-labs/images/week04.Dockerfile
    environment:
      FLAG_SQLI: ${FLAG_SQLI:-FLAG{replace_this_week04_sqli_flag}}
      FLAG_CMDI: ${FLAG_CMDI:-FLAG{replace_this_week04_cmdi_flag}}
    sysctls:
      # Modern Linux ping sockets work for this unprivileged group range; retain
      # cap_drop=ALL instead of granting NET_RAW to the command-injection target.
      net.ipv4.ping_group_range: "0 2147483647"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    networks:
      - week04_net
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  week04-relay:
    <<: *relay-defaults
    environment:
      UPSTREAM: week04:5000
    depends_on:
      week04:
        condition: service_healthy
    networks:
      - week04_net
      - ingress_net

  week05:
    <<: *sandbox-defaults
    build:
      context: ../..
      dockerfile: deploy/internal-labs/images/week05.Dockerfile
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    networks:
      - week05_net
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  week05-relay:
    <<: *relay-defaults
    environment:
      UPSTREAM: week05:5000
    depends_on:
      week05:
        condition: service_healthy
    networks:
      - week05_net
      - ingress_net

  week06:
    <<: *sandbox-defaults
    build:
      context: ../..
      dockerfile: deploy/internal-labs/images/week06.Dockerfile
    environment:
      FLAG_IDOR: ${FLAG_IDOR:-FLAG{replace_this_week06_idor_flag}}
      FLAG_JWT: ${FLAG_JWT:-FLAG{replace_this_week06_jwt_flag}}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    networks:
      - week06_net
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  week06-relay:
    <<: *relay-defaults
    environment:
      UPSTREAM: week06:5000
    depends_on:
      week06:
        condition: service_healthy
    networks:
      - week06_net
      - ingress_net

  notevault-team-1:
    <<: *sandbox-defaults
    profiles: [team1, all-teams]
    build:
      context: ../..
      dockerfile: deploy/internal-labs/images/notevault.Dockerfile
    environment:
      TEAM_ID: ${TEAM_1_ID:-team-one-demo}
      TEAM_SALT: ${TEAM_1_SALT:?set TEAM_1_SALT}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    networks:
      team1_net:
        aliases: [notevault-team-1]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  notevault-team-1-relay:
    <<: *relay-defaults
    profiles: [team1, all-teams]
    environment:
      UPSTREAM: notevault-team-1:8080
    depends_on:
      notevault-team-1:
        condition: service_healthy
    networks:
      - team1_net
      - ingress_net

  notevault-team-2:
    <<: *sandbox-defaults
    profiles: [team2, all-teams]
    build:
      context: ../..
      dockerfile: deploy/internal-labs/images/notevault.Dockerfile
    environment:
      TEAM_ID: ${TEAM_2_ID:-team-two-demo}
      TEAM_SALT: ${TEAM_2_SALT:?set TEAM_2_SALT}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    networks:
      team2_net:
        aliases: [notevault-team-2]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  notevault-team-2-relay:
    <<: *relay-defaults
    profiles: [team2, all-teams]
    environment:
      UPSTREAM: notevault-team-2:8080
    depends_on:
      notevault-team-2:
        condition: service_healthy
    networks:
      - team2_net
      - ingress_net

volumes:
  caddy_data:
  caddy_config:
  learning_data:

networks:
  # A separate internal bridge per target prevents an intended command-injection
  # or XSS exercise from becoming a route to another lab. Each bridge contains
  # only its app plus a fixed-upstream relay. Explicit subnets let the host's
  # DOCKER-USER policy fail closed if a future edit accidentally adds a route.
  learning_net:
    internal: true
    ipam:
      config: [{subnet: 172.30.1.0/24}]
  week01_net:
    internal: true
    ipam:
      config: [{subnet: 172.30.2.0/24}]
  week04_net:
    internal: true
    ipam:
      config: [{subnet: 172.30.4.0/24}]
  week05_net:
    internal: true
    ipam:
      config: [{subnet: 172.30.5.0/24}]
  week06_net:
    internal: true
    ipam:
      config: [{subnet: 172.30.6.0/24}]
  team1_net:
    internal: true
    ipam:
      config: [{subnet: 172.30.7.0/24}]
  team2_net:
    internal: true
    ipam:
      config: [{subnet: 172.30.8.0/24}]
  # Publishing from an `internal` bridge is intentionally disabled by current
  # Docker. This ingress bridge is therefore non-internal, but it contains only
  # trusted Caddy/relay processes; the host egress guard blocks its off-host
  # traffic. No intentionally vulnerable app joins it.
  ingress_net:
    ipam:
      config: [{subnet: 172.30.254.0/24}]
